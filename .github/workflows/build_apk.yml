name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    # 22.04 still ships libtinfo5, which the Android NDK toolchain expects.
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Use Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # p4a is happiest with the 0.29.x Cython series.
          pip install buildozer "cython==0.29.36" pillow

      - name: Cache Android SDK/NDK + Gradle
        uses: actions/cache@v4
        with:
          # Cache only the downloaded toolchains, never the p4a build dirs.
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
            ~/.gradle
          key: buildozer-sdk-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sdk-${{ runner.os }}-

      - name: Verify buildozer.spec exists
        run: |
          test -f buildozer.spec
          buildozer --version

      - name: Build debug APK
        run: |
          # Buildozer manages its own SDK/NDK; drop the runner-provided ones.
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          buildozer -v android debug
        timeout-minutes: 120

      - name: Show build log on failure
        if: failure()
        run: |
          find .buildozer -name 'build.log' -print -exec tail -n 300 {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT_Audio_Player-apk
          path: bin/*.apk
          if-no-files-found: error
